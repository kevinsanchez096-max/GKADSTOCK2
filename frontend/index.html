<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GKAD STOCK — System POS</title>
    <script>
      (function() {
        try {
          const orgId = localStorage.getItem('gkad_last_org_id');
          
          // Si hay organización, usamos su tema específico. Si no, usamos los valores neutros de GKAD (Azul/Oscuro)
          // Esto evita que aparezcan colores verdes o antiguos guardados en llaves genéricas.
          const theme = orgId ? (localStorage.getItem('gkad_theme_' + orgId) || 'dark') : 'dark';
          const color = orgId ? (localStorage.getItem('gkad_brand_color_' + orgId) || '#3b82f6') : '#3b82f6';
          
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          
          // Aplicar el color de marca inmediatamente
          document.documentElement.style.setProperty('--brand-primary', color);
          
          // Limpieza preventiva de rastro antiguo para asegurar profesionalismo
          localStorage.removeItem('theme');
          localStorage.removeItem('gkad_brand_color'); 
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
